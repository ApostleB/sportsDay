# /etc/nginx/conf.d/yeong-min.bytebard.cloud.conf
# 인증서: certbot certonly --webroot -w /var/www/certbot -d yeong-min.bytebard.cloud --key-type ecdsa
server {
    listen 80;
    server_name yeong-min.bytebard.cloud;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name yeong-min.bytebard.cloud;
    proxy_http_version 1.1;

    # 시간표 이미지 업로드 한도(5MB)보다 조금 크게
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:3080;

        proxy_set_header Host              $host;
        # 앱은 trust proxy 1로 X-Forwarded-For의 마지막 값을 req.ip로 쓴다(시도 제한 키)
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 없으면 secure 세션 쿠키가 발급되지 않아 로그인이 유지되지 않는다
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ssl_certificate /etc/letsencrypt/live/yeong-min.bytebard.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yeong-min.bytebard.cloud/privkey.pem;
}
